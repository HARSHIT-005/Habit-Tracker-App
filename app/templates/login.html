<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{url_for('static',filename='css/st1.css')}}">


</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="container">
        <div class="row">
            <div class="col-12 col-lg-7 mb-3 p-0">
                <img class="w-100 h-100 object-fit-cover rounded"
                    src="{{ url_for('static', filename='images/illustration.jpg') }}">
            </div>

            <div class="col-12 col-lg-5 d-flex flex-column align-items-center justify-content-start">
                <div class="text-center mt-4 mb-3">
                    <img class="rounded" src="{{ url_for('static', filename='images/sml.png') }}" style="height: 40px;">
                </div>
                <h3>Login into your account</h3>
                <p>See what is going on with your business</p>
                <button class="btn btn-outline-secondary w-75 mb-3">
                    <img src="{{ url_for('static', filename='images/glogo.png') }}" style="height: 20px;"> Continue with
                    Google
                </button>

                <div class="flip-card-container w-100">
                    <div class="flip-card" id="flipCard">
                        <!-- FRONT: LOGIN -->
                        <div class="flip-card-front">
                            <p class="text-center">---------- or sign-in with email ----------</p>
                            <form method="post" id="signinform">
                                <div class="mb-3">
                                    <label>Email address</label>
                                    <input name="email" type="email" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Password</label>
                                    <div class="input-group">
                                        <input name="password" type="password" class="form-control" id="passwordInput">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" class="lbtn mb-3">Login</button>
                                <p>Don't have an account? <a href="#" id="tosignup">Create one</a></p>
                            </form>
                        </div>

                        <!-- BACK: SIGNUP -->
                        <div class="flip-card-back">
                            <h3>Sign Up</h3>
                            <form method="post" id="signupform">
                                <div class="mb-3">
                                    <label>Username</label>
                                    <input name="Username" type="text" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Dob</label>
                                    <input name="dob" type="date" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Email address</label>
                                    <input name="email" type="email" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label>Password</label>
                                    <div class="input-group">
                                        <input name="password" type="password" class="form-control"
                                            id="signupPasswordInput">
                                        <button class="btn btn-outline-secondary" type="button"
                                            id="toggleSignupPassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success w-100 mb-3">Submit</button>
                                <p>Already have an account? <a href="#" id="tosignin">Sign in</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast" class="toast-notification translate-x-full">
        <div id="toastMessage"></div>
    </div>
    <script src="{{url_for('static',filename='js/login.js')}}"></script>
</body>

</html>
